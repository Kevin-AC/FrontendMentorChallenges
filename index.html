<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Blog preview card</title>

  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="main-card">
    <img class="main-card-Illustration" src="./assets/images/illustration-article.svg" alt="Illustration">
    <section class="container">
      <h3 class="container-type">Learning</h3>
      <p class="container-date">Published 21 Dec 2023</p>
      <h2 class="container-title">HTML & CSS foundations</h1>
      <p class="container-paragraph">
        These languages are the backbone of every website, 
        defining structure, content, and presentation.
      </p>
    </section>
    <section class="profile">
      <img src="./assets/images/image-avatar.webp" alt="profile_avatar">
      <p>Greg Hooper</p>
    </section>
</div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Kevin-AC?tab=repositories">Kevin Argumedo</a>.
  </div>
</body>
</html>
